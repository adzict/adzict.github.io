<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="case study visual">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="55%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title{font:800 48px Arial, sans-serif;fill:#f8fafc;letter-spacing:-1px}
      .subtitle{font:400 22px Arial, sans-serif;fill:#cbd5e1}
      .label{font:700 15px Arial, sans-serif;fill:#94a3b8;text-transform:uppercase;letter-spacing:1.2px}
      .value{font:800 34px Arial, sans-serif;fill:#f8fafc}
      .small{font:500 16px Arial, sans-serif;fill:#cbd5e1}
      .tiny{font:500 13px Arial, sans-serif;fill:#94a3b8}
      .card{fill:rgba(15,23,42,0.72);stroke:rgba(255,255,255,0.12);stroke-width:1.2;filter:url(#shadow)}
      .mini{fill:rgba(255,255,255,0.08);stroke:rgba(255,255,255,0.16)}
      .axis{stroke:#475569;stroke-width:2}
      .grid{stroke:#334155;stroke-width:1;opacity:.55}
      .cyan{fill:#22d3ee} .purple{fill:#a78bfa} .orange{fill:#fb923c} .green{fill:#34d399} .red{fill:#fb7185} .yellow{fill:#facc15}
      .line-cyan{stroke:#22d3ee;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .line-purple{stroke:#a78bfa;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .line-orange{stroke:#fb923c;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .line-red{stroke:#fb7185;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
    
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1040" cy="80" r="230" fill="#22d3ee" opacity=".08"/>
  <circle cx="80" cy="620" r="220" fill="#a78bfa" opacity=".08"/>
  <path d="M880 0 C930 150 1080 160 1200 90 L1200 0 Z" fill="url(#accent)" opacity=".18"/>
  <text x="70" y="70" class="label">SELECTED VISUAL</text><text x="70" y="125" class="title">Top 100 Scoring Output</text>
    <text x="70" y="160" class="subtitle">Anonymized example of how the model output was made usable for business teams.</text><rect x="70" y="205" width="1060" height="390" rx="28" class="card"/><text x="100" y="260" class="label">Segment</text><text x="360" y="260" class="label">Age</text><text x="470" y="260" class="label">Income</text><text x="610" y="260" class="label">Balance</text><text x="780" y="260" class="label">Probability</text><text x="950" y="260" class="label">Action</text><line x1="95" y1="287" x2="1090" y2="287" stroke="#334155"/><text x="100" y="315" class="small">High-potential lead</text><text x="360" y="315" class="small">41</text><text x="470" y="315" class="small">€918</text><text x="610" y="315" class="small">€15,775</text><text x="780" y="315" class="small">99.98%</text><text x="950" y="315" class="small">CRM outreach</text><line x1="95" y1="345" x2="1090" y2="345" stroke="#334155"/><text x="100" y="373" class="small">High-potential lead</text><text x="360" y="373" class="small">47</text><text x="470" y="373" class="small">€383</text><text x="610" y="373" class="small">€9,000</text><text x="780" y="373" class="small">99.98%</text><text x="950" y="373" class="small">CRM outreach</text><line x1="95" y1="403" x2="1090" y2="403" stroke="#334155"/><text x="100" y="431" class="small">High-potential lead</text><text x="360" y="431" class="small">39</text><text x="470" y="431" class="small">€764</text><text x="610" y="431" class="small">€9,230</text><text x="780" y="431" class="small">99.98%</text><text x="950" y="431" class="small">CRM outreach</text><line x1="95" y1="461" x2="1090" y2="461" stroke="#334155"/><text x="100" y="489" class="small">High-potential lead</text><text x="360" y="489" class="small">55</text><text x="470" y="489" class="small">—</text><text x="610" y="489" class="small">€9,615</text><text x="780" y="489" class="small">99.91%</text><text x="950" y="489" class="small">Review + outreach</text><text x="100" y="560" class="tiny">Customer identifiers omitted in the public version.</text>
</svg>