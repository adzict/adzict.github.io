    <text x="668" y="330" class="small">comparison workflow</text><rect x="895" y="210" width="235" height="145" rx="24" class="card"/>
    <rect x="917" y="232" width="10" height="101" rx="5" fill="#34d399"/>
    <text x="943" y="253" class="label">Focus</text>
    <text x="943" y="298" class="value">Interpret</text>
    <text x="943" y="330" class="small">not only predict</text><rect x="70" y="410" width="500" height="200" rx="26" class="card"/><text x="100" y="450" class="label">Speed vs stopping distance</text><circle cx="120" cy="550" r="7" fill="#22d3ee" opacity=".9"/><circle cx="170" cy="535" r="7" fill="#22d3ee" opacity=".9"/><circle cx="220" cy="520" r="7" fill="#22d3ee" opacity=".9"/><circle cx="260" cy="500" r="7" fill="#22d3ee" opacity=".9"/><circle cx="310" cy="485" r="7" fill="#22d3ee" opacity=".9"/><circle cx="350" cy="455" r="7" fill="#22d3ee" opacity=".9"/><circle cx="390" cy="440" r="7" fill="#22d3ee" opacity=".9"/><circle cx="430" cy="400" r="7" fill="#22d3ee" opacity=".9"/><circle cx="470" cy="375" r="7" fill="#22d3ee" opacity=".9"/><circle cx="520" cy="340" r="7" fill="#22d3ee" opacity=".9"/><path d="M110 560 L525 330" class="line-orange"/><rect x="620" y="410" width="510" height="200" rx="26" class="card"/><text x="650" y="450" class="label">Model comparison</text><line x1="665" y1="570" x2="1060" y2="570" class="axis"/>
