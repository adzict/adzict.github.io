<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="case study visual">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="55%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title{font:800 48px Arial, sans-serif;fill:#f8fafc;letter-spacing:-1px}
      .subtitle{font:400 22px Arial, sans-serif;fill:#cbd5e1}
      .label{font:700 15px Arial, sans-serif;fill:#94a3b8;text-transform:uppercase;letter-spacing:1.2px}
      .value{font:800 34px Arial, sans-serif;fill:#f8fafc}
      .small{font:500 16px Arial, sans-serif;fill:#cbd5e1}
      .tiny{font:500 13px Arial, sans-serif;fill:#94a3b8}
      .card{fill:rgba(15,23,42,0.72);stroke:rgba(255,255,255,0.12);stroke-width:1.2;filter:url(#shadow)}
      .mini{fill:rgba(255,255,255,0.08);stroke:rgba(255,255,255,0.16)}
      .axis{stroke:#475569;stroke-width:2}
      .grid{stroke:#334155;stroke-width:1;opacity:.55}
      .cyan{fill:#22d3ee} .purple{fill:#a78bfa} .orange{fill:#fb923c} .green{fill:#34d399} .red{fill:#fb7185} .yellow{fill:#facc15}
      .line-cyan{stroke:#22d3ee;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .line-purple{stroke:#a78bfa;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .line-orange{stroke:#fb923c;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .line-red{stroke:#fb7185;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1040" cy="80" r="230" fill="#22d3ee" opacity=".08"/>
  <circle cx="80" cy="620" r="220" fill="#a78bfa" opacity=".08"/>
  <path d="M880 0 C930 150 1080 160 1200 90 L1200 0 Z" fill="url(#accent)" opacity=".18"/>
  <text x="70" y="70" class="label">CASE STUDY · ANALYTICS STRATEGY</text><text x="70" y="125" class="title">Data Science POC Roadmap</text>
    <text x="70" y="160" class="subtitle">Connecting digital marketing decisions with measurable analytics use cases</text><rect x="70" y="210" width="245" height="145" rx="24" class="card"/>
    <rect x="92" y="232" width="10" height="101" rx="5" fill="#22d3ee"/>
    <text x="118" y="253" class="label">A/B Testing</text>
    <text x="118" y="298" class="value">CTR · CVR</text>
    <text x="118" y="330" class="small">experiment design</text><rect x="345" y="210" width="245" height="145" rx="24" class="card"/>
    <rect x="367" y="232" width="10" height="101" rx="5" fill="#a78bfa"/>
    <text x="393" y="253" class="label">Keyword Model</text>
    <text x="393" y="298" class="value">SEO</text>
    <text x="393" y="330" class="small">traffic prediction</text><rect x="620" y="210" width="245" height="145" rx="24" class="card"/>
    <rect x="642" y="232" width="10" height="101" rx="5" fill="#fb923c"/>
    <text x="668" y="253" class="label">Segmentation</text>
    <text x="668" y="298" class="value">Clusters</text>
    <text x="668" y="330" class="small">customer behavior</text><rect x="895" y="210" width="235" height="145" rx="24" class="card"/>
    <rect x="917" y="232" width="10" height="101" rx="5" fill="#34d399"/>
    <text x="943" y="253" class="label">Sentiment</text>
    <text x="943" y="298" class="value">71%</text>
    <text x="943" y="330" class="small">VADER example</text><rect x="70" y="430" width="1060" height="130" rx="28" class="card"/><rect x="105" y="470" width="130" height="48" rx="16" fill="url(#accent)" opacity=".88"/><text x="170" y="500" text-anchor="middle" class="tiny" fill="#fff">Use case</text><path d="M235 494 L265 494" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/><rect x="275" y="470" width="130" height="48" rx="16" fill="url(#accent)" opacity=".88"/><text x="340" y="500" text-anchor="middle" class="tiny" fill="#fff">Data</text><path d="M405 494 L435 494" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/><rect x="445" y="470" width="130" height="48" rx="16" fill="url(#accent)" opacity=".88"/><text x="510" y="500" text-anchor="middle" class="tiny" fill="#fff">Metric</text><path d="M575 494 L605 494" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/><rect x="615" y="470" width="130" height="48" rx="16" fill="url(#accent)" opacity=".88"/><text x="680" y="500" text-anchor="middle" class="tiny" fill="#fff">Experiment</text><path d="M745 494 L775 494" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/><rect x="785" y="470" width="130" height="48" rx="16" fill="url(#accent)" opacity=".88"/><text x="850" y="500" text-anchor="middle" class="tiny" fill="#fff">Model</text><path d="M915 494 L945 494" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/><rect x="955" y="470" width="130" height="48" rx="16" fill="url(#accent)" opacity=".88"/><text x="1020" y="500" text-anchor="middle" class="tiny" fill="#fff">Recommendation</text>
</svg>